# pyproject.toml — lives at the PROJECT ROOT, next to launcher.py
#
# Tooling config only. `[project]` metadata is intentionally deferred: the game
# ships as a PyInstaller bundle (`Pandemonium.spec` / `make_exe.py`), not as an
# installable package. Add it only if that changes.
#
# pytest runs from the repo root; `pythonpath = ["."]` is what lets tests use
# `import pandemonium...` (or the older flat names) without sys.path hacks.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Put the repo root on sys.path for tests, so `import utils` works today and
# `import pandemonium.core.utils` works after the move — no per-file
# sys.path.insert() needed.
pythonpath = ["."]
norecursedirs = [
    ".git", ".venv", ".idea", ".pytest_cache", "__pycache__",
    "build", "dist",
    "docs", "wiki", "resources", "savefile", "scripts",
]
